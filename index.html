<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Burners Campaigns</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <style>
      .page-tools {
        margin-top: 2.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid #eee;
        font-size: 0.9rem;
        color: #666;
      }
      .page-tools a {
        color: #42b983;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const SUGGEST_EMAIL = "pabrams@gmail.com";
      const GITHUB_BLOB =
        "https://github.com/paulabrams/burners-campaigns/blob/main/";
      // mailto bodies blow up past ~1800 chars on many clients
      const MAILTO_BODY_LIMIT = 1800;

      window.$docsify = {
        name: "Burners Campaigns",
        repo: "paulabrams/burners-campaigns",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        homepage: "README.md",
        // Sibling-relative links in markdown (Obsidian-friendly).
        // Sidebar uses absolute /paths with basePath for GitHub Pages.
        relativePath: true,
        basePath: location.pathname.replace(/\/[^/]*$/, "/"),
        alias: {
          "/": "/README.md",
        },
        plugins: [
          function pageTools(hook, vm) {
            hook.afterEach(function (html) {
              const file = (vm.route.file || "README.md").replace(/^\//, "");
              const markdownUrl = GITHUB_BLOB + file;
              return (
                html +
                '<p class="page-tools">' +
                '<a href="' +
                markdownUrl +
                '" target="_blank" rel="noopener">View markdown</a>' +
                " · " +
                '<a href="#" class="suggest-change" data-file="' +
                file +
                '">Suggest a change</a>' +
                "</p>"
              );
            });

            hook.doneEach(function () {
              const link = document.querySelector(".suggest-change");
              if (!link || link.dataset.bound) return;
              link.dataset.bound = "1";
              link.addEventListener("click", async function (e) {
                e.preventDefault();
                e.stopPropagation();
                const file = link.dataset.file || "README.md";
                const markdownUrl = GITHUB_BLOB + file;
                let markdown = "";
                try {
                  const res = await fetch(vm.config.basePath + file);
                  if (res.ok) markdown = await res.text();
                } catch (_) {
                  /* fall through */
                }

                const header = [
                  "Page: " + file,
                  "Site: " + location.href,
                  "Markdown: " + markdownUrl,
                  "",
                  "Edit the markdown below and send:",
                  "",
                ].join("\n");

                let body =
                  header +
                  (markdown ||
                    "(Could not load page text — paste from View markdown.)");
                if (encodeURIComponent(body).length > MAILTO_BODY_LIMIT) {
                  try {
                    await navigator.clipboard.writeText(markdown);
                    body =
                      header +
                      "(Full page copied to your clipboard — paste below and edit.)\n\n";
                  } catch (_) {
                    body =
                      header +
                      "(Page is too long for email — open View markdown, copy, paste below, and edit.)\n\n";
                  }
                }

                const mailto =
                  "mailto:" +
                  SUGGEST_EMAIL +
                  "?subject=" +
                  encodeURIComponent("Campaign notes update: " + file) +
                  "&body=" +
                  encodeURIComponent(body);
                window.location.href = mailto;
              });
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  </body>
</html>
