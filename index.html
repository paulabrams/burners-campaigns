<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Burners Campaigns</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <style>
      .page-tools {
        margin-top: 2.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid #eee;
        font-size: 0.9rem;
        color: #666;
      }
      .page-tools a {
        color: #42b983;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const SUGGEST_EMAIL = "pabrams@gmail.com";
      const GITHUB_BLOB =
        "https://github.com/paulabrams/burners-campaigns/blob/main/";

      window.$docsify = {
        name: "Burners Campaigns",
        repo: "paulabrams/burners-campaigns",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        homepage: "README.md",
        // Sibling-relative links in markdown (Obsidian-friendly).
        // Sidebar uses absolute /paths with basePath for GitHub Pages.
        relativePath: true,
        basePath: location.pathname.replace(/\/[^/]*$/, "/"),
        alias: {
          "/": "/README.md",
        },
        plugins: [
          function pageTools(hook, vm) {
            hook.afterEach(function (html) {
              const file = (vm.route.file || "README.md").replace(/^\//, "");
              const markdownUrl = GITHUB_BLOB + file;
              const subject = encodeURIComponent(
                "Campaign notes update: " + file,
              );
              const body = encodeURIComponent(
                [
                  "Page: " + file,
                  "Site: " + location.href,
                  "Markdown: " + markdownUrl,
                  "",
                  "Suggested changes:",
                  "",
                ].join("\n"),
              );
              const mailto =
                "mailto:" +
                SUGGEST_EMAIL +
                "?subject=" +
                subject +
                "&body=" +
                body;
              return (
                html +
                '<p class="page-tools">' +
                '<a href="' +
                markdownUrl +
                '" target="_blank" rel="noopener">View markdown</a>' +
                " · " +
                '<a href="' +
                mailto +
                '">Suggest a change</a>' +
                "</p>"
              );
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  </body>
</html>
