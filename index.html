<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Burners Campaigns</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <style>
      .page-tools {
        margin-top: 2.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid #eee;
        font-size: 0.9rem;
        color: #666;
      }
      .page-tools a {
        color: #42b983;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // mailto bodies blow up past ~1800 chars on many clients
      const MAILTO_BODY_LIMIT = 1800;

      window.$docsify = {
        name: "Burners Campaigns",
        repo: "paulabrams/burners-campaigns",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        homepage: "README.md",
        // Sibling-relative links in markdown (Obsidian-friendly).
        // Sidebar uses absolute /paths with basePath for GitHub Pages.
        relativePath: true,
        basePath: location.pathname.replace(/\/[^/]*$/, "/"),
        alias: {
          "/": "/README.md",
        },
        plugins: [
          function pageTools(hook, vm) {
            function sourceUrl(file) {
              return new URL(vm.config.basePath + file, location.href).href;
            }

            function mailtoHref(file, markdownUrl, markdown) {
              const header = [
                "Page: " + file,
                "Site: " +
                  location.href.split("#")[0] +
                  "#/" +
                  file.replace(/\.md$/, ""),
                "Source: " + markdownUrl,
                "",
                "To: (fill in Paul's email — players know it)",
                "",
                "Edit the markdown below and send:",
                "",
              ].join("\n");

              let body = header + (markdown || "(Paste from View markdown.)");
              if (encodeURIComponent(body).length > MAILTO_BODY_LIMIT) {
                body =
                  header +
                  "(Page is too long for email — open View markdown, copy, paste below, and edit.)\n\n";
              }

              // Empty To: — user enters the address in their mail client
              return (
                "mailto:?" +
                "subject=" +
                encodeURIComponent("Campaign notes update: " + file) +
                "&body=" +
                encodeURIComponent(body)
              );
            }

            hook.afterEach(function (html) {
              const file = (vm.route.file || "README.md").replace(/^\//, "");
              const markdownUrl = sourceUrl(file);
              // Real mailto from the start so the click stays a user gesture
              const href = mailtoHref(file, markdownUrl, "");
              return (
                html +
                '<p class="page-tools">' +
                '<a href="' +
                markdownUrl +
                '" target="_blank" rel="noopener">View markdown</a>' +
                " · " +
                '<a class="suggest-change" data-file="' +
                file +
                '" href="' +
                href +
                '" title="Opens your mail app — put Paul\'s address in To">Suggest a change</a>' +
                "</p>"
              );
            });

            hook.doneEach(function () {
              const link = document.querySelector(".suggest-change");
              if (!link || link.dataset.loaded) return;
              const file = link.dataset.file || "README.md";
              const markdownUrl = sourceUrl(file);
              fetch(markdownUrl)
                .then(function (res) {
                  return res.ok ? res.text() : "";
                })
                .then(function (markdown) {
                  link.href = mailtoHref(file, markdownUrl, markdown);
                  link.dataset.loaded = "1";
                })
                .catch(function () {
                  /* keep stub mailto */
                });
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  </body>
</html>
